{% extends 'core/base.html' %}

{% block content %}
<h1 class="mb-3">Disconnected Institutions Report</h1>
<ul class="list-group">
    {% for institution in institutions %}
        <li class="list-group-item">{{ institution.name }}</li>
    {% empty %}
        <li class="list-group-item">No disconnected institutions.</li>
    {% endfor %}
</ul>
{% endblock %}
